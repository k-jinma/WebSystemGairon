<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第26回 テーブル復習</title>
    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- border="1" は削除し、罫線はCSSで引く。
         サマリーと日時のセルには、色を変えるためのクラスを付けた。 -->
    <table>
        <tr>
            <th><input type="checkbox"></th>
            <th>件名</th>
            <th>サマリー</th>
            <th>日時</th>
        </tr>
        <tr>
            <td><input type="checkbox"></td>
            <td>セール開催のお知らせ</td>
            <td class="summary">会員様限定クーポンをお届けします</td>
            <td class="date">10:23</td>
        </tr>
        <tr>
            <td><input type="checkbox"></td>
            <td>履修登録の締切について</td>
            <td class="summary">前期履修登録は5月10日までです</td>
            <td class="date">5月2日</td>
        </tr>
        <tr>
            <td><input type="checkbox"></td>
            <td>図書返却のリマインド</td>
            <td class="summary">貸出中の書籍の返却期限が近づいています</td>
            <td class="date">4月28日</td>
        </tr>
    </table>

</body>

</html>
